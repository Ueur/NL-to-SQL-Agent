# NL-to-SQL Eval Set — Olist Brazilian E-Commerce
# 30 questions: 8 easy, 12 medium, 10 hard
# Scored on result match, not SQL text.

# --- EASY (8) ---

- id: 1
  question: "How many unique customers are in the database?"
  gold_sql: |
    SELECT COUNT(DISTINCT customer_unique_id) FROM customers
  difficulty: easy
  tags: [single_table, count, distinct]
  order_matters: false

- id: 2
  question: "How many orders have the status 'delivered'?"
  gold_sql: |
    SELECT COUNT(*) FROM orders WHERE order_status = 'delivered'
  difficulty: easy
  tags: [single_table, filter, count]
  order_matters: false

- id: 3
  question: "What are all the distinct order statuses?"
  gold_sql: |
    SELECT DISTINCT order_status FROM orders ORDER BY order_status
  difficulty: easy
  tags: [single_table, distinct]
  order_matters: true

- id: 4
  question: "How many sellers are located in the state of SP?"
  gold_sql: |
    SELECT COUNT(*) FROM sellers WHERE seller_state = 'SP'
  difficulty: easy
  tags: [single_table, filter, count]
  order_matters: false

- id: 5
  question: "What is the average review score across all reviews?"
  gold_sql: |
    SELECT ROUND(AVG(review_score), 4) FROM order_reviews
  difficulty: easy
  tags: [single_table, aggregate]
  order_matters: false

- id: 6
  question: "What is the most common payment type?"
  gold_sql: |
    SELECT payment_type FROM order_payments
    GROUP BY payment_type ORDER BY COUNT(*) DESC LIMIT 1
  difficulty: easy
  tags: [single_table, group_by, order_limit]
  order_matters: false

- id: 7
  question: "How many orders were placed in 2017?"
  gold_sql: |
    SELECT COUNT(*) FROM orders
    WHERE substr(order_purchase_timestamp, 1, 4) = '2017'
  difficulty: easy
  tags: [single_table, date, filter, count]
  order_matters: false

- id: 8
  question: "What are the top 5 customer cities by number of customers?"
  gold_sql: |
    SELECT customer_city, COUNT(DISTINCT customer_unique_id) AS cnt
    FROM customers GROUP BY customer_city ORDER BY cnt DESC LIMIT 5
  difficulty: easy
  tags: [single_table, group_by, order_limit]
  order_matters: true

# --- MEDIUM (12) ---

- id: 9
  question: "What are the top 5 product categories by number of items sold?"
  gold_sql: |
    SELECT COALESCE(ct.product_category_name_english, p.product_category_name) AS category,
           COUNT(*) AS items_sold
    FROM order_items oi
    JOIN products p ON oi.product_id = p.product_id
    LEFT JOIN category_translation ct ON p.product_category_name = ct.product_category_name
    WHERE p.product_category_name IS NOT NULL
    GROUP BY category
    ORDER BY items_sold DESC
    LIMIT 5
  difficulty: medium
  tags: [join, group_by, order_limit]
  order_matters: true

- id: 10
  question: "What is the average order value?"
  gold_sql: |
    SELECT ROUND(AVG(order_total), 2) FROM (
      SELECT order_id, SUM(price) AS order_total
      FROM order_items GROUP BY order_id
    )
  difficulty: medium
  tags: [subquery, aggregate]
  order_matters: false

- id: 11
  question: "Which city has the most sellers?"
  gold_sql: |
    SELECT seller_city FROM sellers
    GROUP BY seller_city ORDER BY COUNT(*) DESC LIMIT 1
  difficulty: medium
  tags: [single_table, group_by, order_limit]
  order_matters: false

- id: 12
  question: "Which payment type has the highest average payment value?"
  gold_sql: |
    SELECT payment_type FROM order_payments
    GROUP BY payment_type ORDER BY AVG(payment_value) DESC LIMIT 1
  difficulty: medium
  tags: [single_table, group_by, aggregate]
  order_matters: false

- id: 13
  question: "How many orders contained more than one item?"
  gold_sql: |
    SELECT COUNT(*) FROM (
      SELECT order_id FROM order_items
      GROUP BY order_id HAVING COUNT(*) > 1
    )
  difficulty: medium
  tags: [subquery, having, count]
  order_matters: false

- id: 14
  question: "What are the top 5 sellers by total revenue?"
  gold_sql: |
    SELECT seller_id, ROUND(SUM(price), 2) AS revenue
    FROM order_items GROUP BY seller_id ORDER BY revenue DESC LIMIT 5
  difficulty: medium
  tags: [group_by, aggregate, order_limit]
  order_matters: true

- id: 15
  question: "What is the average review score per product category? Show the top 10."
  gold_sql: |
    SELECT COALESCE(ct.product_category_name_english, p.product_category_name) AS category,
           ROUND(AVG(r.review_score), 2) AS avg_score
    FROM order_reviews r
    JOIN order_items oi ON r.order_id = oi.order_id
    JOIN products p ON oi.product_id = p.product_id
    LEFT JOIN category_translation ct ON p.product_category_name = ct.product_category_name
    WHERE p.product_category_name IS NOT NULL
    GROUP BY category
    ORDER BY avg_score DESC
    LIMIT 10
  difficulty: medium
  tags: [multi_join, group_by, aggregate]
  order_matters: true

- id: 16
  question: "Which customer state has the highest total order value?"
  gold_sql: |
    SELECT c.customer_state
    FROM order_items oi
    JOIN orders o ON oi.order_id = o.order_id
    JOIN customers c ON o.customer_id = c.customer_id
    GROUP BY c.customer_state
    ORDER BY SUM(oi.price) DESC
    LIMIT 1
  difficulty: medium
  tags: [multi_join, group_by, aggregate]
  order_matters: false

- id: 17
  question: "How many orders were paid using more than one payment type?"
  gold_sql: |
    SELECT COUNT(*) FROM (
      SELECT order_id FROM order_payments
      GROUP BY order_id HAVING COUNT(DISTINCT payment_type) > 1
    )
  difficulty: medium
  tags: [subquery, having, distinct]
  order_matters: false

- id: 18
  question: "What is the monthly order count for 2018?"
  gold_sql: |
    SELECT substr(order_purchase_timestamp, 1, 7) AS month,
           COUNT(*) AS order_count
    FROM orders
    WHERE substr(order_purchase_timestamp, 1, 4) = '2018'
    GROUP BY month
    ORDER BY month
  difficulty: medium
  tags: [date, group_by]
  order_matters: true

- id: 19
  question: "What is the total freight cost by seller state?"
  gold_sql: |
    SELECT s.seller_state, ROUND(SUM(oi.freight_value), 2) AS total_freight
    FROM order_items oi
    JOIN sellers s ON oi.seller_id = s.seller_id
    GROUP BY s.seller_state
    ORDER BY total_freight DESC
  difficulty: medium
  tags: [join, group_by, aggregate]
  order_matters: true

- id: 20
  question: "What product category has the highest average product weight?"
  gold_sql: |
    SELECT COALESCE(ct.product_category_name_english, p.product_category_name) AS category,
           ROUND(AVG(p.product_weight_g), 2) AS avg_weight
    FROM products p
    LEFT JOIN category_translation ct ON p.product_category_name = ct.product_category_name
    WHERE p.product_category_name IS NOT NULL AND p.product_weight_g IS NOT NULL
    GROUP BY category
    ORDER BY avg_weight DESC
    LIMIT 1
  difficulty: medium
  tags: [join, group_by, aggregate, null_handling]
  order_matters: false

# --- HARD (10) ---

- id: 21
  question: "Which seller had the highest average review score, among sellers with at least 50 orders?"
  gold_sql: |
    SELECT oi.seller_id
    FROM order_items oi
    JOIN order_reviews r ON oi.order_id = r.order_id
    GROUP BY oi.seller_id
    HAVING COUNT(DISTINCT oi.order_id) >= 50
    ORDER BY AVG(r.review_score) DESC
    LIMIT 1
  difficulty: hard
  tags: [join, having, aggregate, fan_out_risk]
  order_matters: false

- id: 22
  question: "What percentage of delivered orders were delivered late (after the estimated delivery date)?"
  gold_sql: |
    SELECT ROUND(
      100.0 * SUM(CASE
        WHEN order_delivered_customer_date > order_estimated_delivery_date THEN 1
        ELSE 0
      END) / COUNT(*), 2
    ) AS pct_late
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
      AND order_estimated_delivery_date IS NOT NULL
  difficulty: hard
  tags: [date, case_when, percentage]
  order_matters: false

- id: 23
  question: "What is the average delivery time in days per month for delivered orders in 2017?"
  gold_sql: |
    SELECT substr(order_purchase_timestamp, 1, 7) AS month,
           ROUND(AVG(
             julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp)
           ), 2) AS avg_delivery_days
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
      AND substr(order_purchase_timestamp, 1, 4) = '2017'
    GROUP BY month
    ORDER BY month
  difficulty: hard
  tags: [date_arithmetic, group_by, julianday]
  order_matters: true

- id: 24
  question: "What is the cancellation rate by product category? Show categories with at least 20 orders."
  gold_sql: |
    SELECT COALESCE(ct.product_category_name_english, p.product_category_name) AS category,
           ROUND(100.0 * SUM(CASE WHEN o.order_status = 'canceled' THEN 1 ELSE 0 END)
                 / COUNT(DISTINCT o.order_id), 2) AS cancel_rate_pct
    FROM order_items oi
    JOIN orders o ON oi.order_id = o.order_id
    JOIN products p ON oi.product_id = p.product_id
    LEFT JOIN category_translation ct ON p.product_category_name = ct.product_category_name
    WHERE p.product_category_name IS NOT NULL
    GROUP BY category
    HAVING COUNT(DISTINCT o.order_id) >= 20
    ORDER BY cancel_rate_pct DESC
  difficulty: hard
  tags: [multi_join, case_when, having, percentage]
  order_matters: true

- id: 25
  question: "For each customer state, what is the average order value and average review score?"
  gold_sql: |
    SELECT c.customer_state,
           ROUND(AVG(ov.order_total), 2) AS avg_order_value,
           ROUND(AVG(r.review_score), 2) AS avg_review_score
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    JOIN order_reviews r ON o.order_id = r.order_id
    JOIN (
      SELECT order_id, SUM(price) AS order_total
      FROM order_items GROUP BY order_id
    ) ov ON o.order_id = ov.order_id
    GROUP BY c.customer_state
    ORDER BY avg_order_value DESC
  difficulty: hard
  tags: [multi_join, subquery, aggregate, fan_out_risk]
  order_matters: true

- id: 26
  question: "How many repeat customers are there (customers who placed more than one order)?"
  gold_sql: |
    SELECT COUNT(*) FROM (
      SELECT customer_unique_id
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      GROUP BY c.customer_unique_id
      HAVING COUNT(DISTINCT o.order_id) > 1
    )
  difficulty: hard
  tags: [join, subquery, having, tricky_id]
  order_matters: false

- id: 27
  question: "What is the month-over-month order count growth rate for 2018?"
  gold_sql: |
    WITH monthly AS (
      SELECT substr(order_purchase_timestamp, 1, 7) AS month,
             COUNT(*) AS cnt
      FROM orders
      WHERE substr(order_purchase_timestamp, 1, 4) = '2018'
      GROUP BY month
    ),
    with_lag AS (
      SELECT month, cnt,
             LAG(cnt) OVER (ORDER BY month) AS prev_cnt
      FROM monthly
    )
    SELECT month, cnt, prev_cnt,
           ROUND(100.0 * (cnt - prev_cnt) / prev_cnt, 2) AS growth_pct
    FROM with_lag
    WHERE prev_cnt IS NOT NULL
    ORDER BY month
  difficulty: hard
  tags: [cte, window_function, date, growth_rate]
  order_matters: true

- id: 28
  question: "Which sellers have the highest percentage of 5-star reviews, among those with at least 30 reviews?"
  gold_sql: |
    SELECT oi.seller_id,
           COUNT(*) AS total_reviews,
           SUM(CASE WHEN r.review_score = 5 THEN 1 ELSE 0 END) AS five_star,
           ROUND(100.0 * SUM(CASE WHEN r.review_score = 5 THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_five_star
    FROM order_reviews r
    JOIN order_items oi ON r.order_id = oi.order_id
    GROUP BY oi.seller_id
    HAVING COUNT(*) >= 30
    ORDER BY pct_five_star DESC
    LIMIT 10
  difficulty: hard
  tags: [join, case_when, having, percentage, fan_out_risk]
  order_matters: true

- id: 29
  question: "What is the average time between order approval and carrier pickup, in hours, by seller state?"
  gold_sql: |
    SELECT s.seller_state,
           ROUND(AVG(
             (julianday(o.order_delivered_carrier_date) - julianday(o.order_approved_at)) * 24
           ), 2) AS avg_hours_to_ship
    FROM orders o
    JOIN order_items oi ON o.order_id = oi.order_id
    JOIN sellers s ON oi.seller_id = s.seller_id
    WHERE o.order_approved_at IS NOT NULL
      AND o.order_delivered_carrier_date IS NOT NULL
    GROUP BY s.seller_state
    ORDER BY avg_hours_to_ship
  difficulty: hard
  tags: [multi_join, date_arithmetic, julianday, fan_out_risk]
  order_matters: true

- id: 30
  question: "What is the revenue per product category in English? Show the top 10."
  gold_sql: |
    SELECT COALESCE(ct.product_category_name_english, p.product_category_name) AS category,
           ROUND(SUM(oi.price), 2) AS revenue
    FROM order_items oi
    JOIN products p ON oi.product_id = p.product_id
    LEFT JOIN category_translation ct ON p.product_category_name = ct.product_category_name
    WHERE p.product_category_name IS NOT NULL
    GROUP BY category
    ORDER BY revenue DESC
    LIMIT 10
  difficulty: hard
  tags: [multi_join, left_join, coalesce, aggregate]
  order_matters: true
